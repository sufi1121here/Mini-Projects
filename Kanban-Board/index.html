<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Kanban Board | Vanilla JS Drag & Drop</title>
    <meta name="description" content="A high-performance interactive Kanban Board built with pure Vanilla JavaScript, native HTML5 Drag and Drop API, and persistent local storage.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
</head>
<body>
    <div class="app-layout">
        <!-- Top App Bar -->
        <header class="board-header">
            <div class="header-left">
                <div class="brand">
                    <span class="brand-icon">📋</span>
                    <div>
                        <h1>Kanban Studio</h1>
                        <span class="brand-tag">HTML5 Drag & Drop Engine</span>
                    </div>
                </div>

                <div class="board-metrics">
                    <div class="metric-pill">
                        <span class="metric-label">Total Tasks:</span>
                        <span id="metricTotal" class="metric-val">0</span>
                    </div>
                    <div class="metric-pill">
                        <span class="metric-label">Completed:</span>
                        <span id="metricDone" class="metric-val text-emerald">0</span>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <button id="btnOpenAddModal" class="btn btn-primary" title="Create a new task">
                    <span>+ New Task</span>
                </button>
                <button id="btnClearDone" class="btn btn-ghost" title="Clear all tasks from the Done column">
                    <span>🧹 Clear Done</span>
                </button>
                <button id="btnResetBoard" class="btn btn-ghost" title="Reset board to default sample tasks">
                    <span>🔄 Reset Sample</span>
                </button>
                <a href="../index.html" class="btn btn-outline" title="Return to Frontend Playground Dashboard">
                    <span>← Dashboard</span>
                </a>
            </div>
        </header>

        <!-- Board Canvas -->
        <main class="board-canvas">
            <div class="board-columns" id="boardColumns">
                <!-- Column: To Do -->
                <div class="column" data-column-id="todo">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-dot dot-todo"></span>
                            <h2>To Do</h2>
                            <span class="column-count" id="count-todo">0</span>
                        </div>
                        <button class="btn-col-add" data-column="todo" title="Add task to To Do">+</button>
                    </div>
                    <div class="cards-container" data-column-id="todo">
                        <!-- Cards dynamically rendered here -->
                    </div>
                </div>

                <!-- Column: In Progress -->
                <div class="column" data-column-id="in-progress">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-dot dot-progress"></span>
                            <h2>In Progress</h2>
                            <span class="column-count" id="count-in-progress">0</span>
                        </div>
                        <button class="btn-col-add" data-column="in-progress" title="Add task to In Progress">+</button>
                    </div>
                    <div class="cards-container" data-column-id="in-progress">
                        <!-- Cards dynamically rendered here -->
                    </div>
                </div>

                <!-- Column: Review -->
                <div class="column" data-column-id="review">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-dot dot-review"></span>
                            <h2>Review</h2>
                            <span class="column-count" id="count-review">0</span>
                        </div>
                        <button class="btn-col-add" data-column="review" title="Add task to Review">+</button>
                    </div>
                    <div class="cards-container" data-column-id="review">
                        <!-- Cards dynamically rendered here -->
                    </div>
                </div>

                <!-- Column: Done -->
                <div class="column" data-column-id="done">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-dot dot-done"></span>
                            <h2>Done</h2>
                            <span class="column-count" id="count-done">0</span>
                        </div>
                        <button class="btn-col-add" data-column="done" title="Add task to Done">+</button>
                    </div>
                    <div class="cards-container" data-column-id="done">
                        <!-- Cards dynamically rendered here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Task Modal (Create / Edit) -->
    <div id="taskModal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Task</h3>
                <button id="btnCloseModal" class="btn-close" aria-label="Close modal">✕</button>
            </div>
            <form id="taskForm" class="modal-body">
                <input type="hidden" id="taskId">
                <input type="hidden" id="taskColumn" value="todo">

                <div class="form-group">
                    <label for="taskTitleInput">Task Title <span class="required">*</span></label>
                    <input type="text" id="taskTitleInput" placeholder="e.g. Implement OAuth2 Refresh Flow" required maxlength="100" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="taskDescInput">Description</label>
                    <textarea id="taskDescInput" rows="3" placeholder="Add additional details, acceptance criteria, or links..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriorityInput">Priority</label>
                        <select id="taskPriorityInput">
                            <option value="low">Low Priority</option>
                            <option value="medium" selected>Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskColumnSelect">Column</label>
                        <select id="taskColumnSelect">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="review">Review</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskTagsInput">Tags <span class="label-hint">(comma separated)</span></label>
                    <input type="text" id="taskTagsInput" placeholder="e.g. backend, security, api" autocomplete="off">
                </div>

                <div class="modal-footer">
                    <button type="button" id="btnCancelModal" class="btn btn-ghost">Cancel</button>
                    <button type="submit" id="btnSaveTask" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
